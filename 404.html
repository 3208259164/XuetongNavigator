<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 | 资源导航</title>
<style>
  :root{--bg:#f6f7f9;--panel:#fff;--text:#1a1d23;--sub:#6b7280;--line:#e8eaee;--brand:#2f6bff}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#171b22;--text:#f2f5f7;--sub:#8a94a6;--line:#232a34;--brand:#4d86ff}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .box{text-align:center;max-width:360px}
  .code{font-size:64px;font-weight:700;letter-spacing:-2px;color:var(--brand);line-height:1}
  h1{font-size:17px;margin:14px 0 8px}
  p{font-size:13px;color:var(--sub);line-height:1.7}
  a{
    display:inline-block;margin-top:22px;padding:10px 22px;border-radius:999px;
    background:var(--brand);color:#fff;text-decoration:none;font-size:13.5px;font-weight:500;
  }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>链接可能已经失效，或者地址输错了。<br>回首页继续找你要的站点。</p>
  <a href="/">返回首页</a>
</div>
</body>
</html>
