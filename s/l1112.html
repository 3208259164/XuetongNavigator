<script>
(function(){
  var t=null;
  try{t=localStorage.getItem('nav_theme_v1')}catch(e){}
  if(!t) t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);

  var KEY='nav_fav_v1';
  function favs(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){return new Set()}}
  var b=document.getElementById('favBtn');
  if(b){
    var id=b.getAttribute('data-id');
    var s=favs();
    if(s.has(id)){b.classList.add('on');b.textContent='\u2605 已收藏'}
    b.addEventListener('click',function(){
      var cur=favs();
      if(cur.has(id)){cur.delete(id);b.classList.remove('on');b.textContent='\u2606 收藏'}
      else{cur.add(id);b.classList.add('on');b.textContent='\u2605 已收藏'}
      try{localStorage.setItem(KEY,JSON.stringify(Array.from(cur)))}catch(e){}
    });
  }
  var c=document.getElementById('copyBtn');
  if(c){
    c.addEventListener('click',function(){
      var u=c.getAttribute('data-url');
      var done=function(){var o=c.textContent;c.textContent='已复制';setTimeout(function(){c.textContent=o},1200)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done,done)}
      else{var ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done()}
    });
  }
})();
</script>
