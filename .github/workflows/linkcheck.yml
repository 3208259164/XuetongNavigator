name: 死链巡检

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '只检测前 N 条（留空检测全部）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 巡检链接
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python tools/linkcheck.py

      - name: 保存报告
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: data/health.json
          retention-days: 30

      - name: 提交巡检结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "巡检结果 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 确保标签存在
        if: env.DEAD_COUNT != '0' && env.DEAD_COUNT != ''
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: '死链巡检', color: 'd73a4a'
              });
            } catch (e) {
              core.info('标签已存在或无法创建：' + e.message);
            }

      - name: 有失效时开 issue
        if: env.DEAD_COUNT != '0' && env.DEAD_COUNT != ''
        uses: actions/github-script@v7
        env:
          DEAD_LIST: ${{ env.DEAD_LIST }}
        with:
          script: |
            const list = process.env.DEAD_LIST || '';
            const count = process.env.DEAD_COUNT;
            const title = `死链巡检：发现 ${count} 条确认失效`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: '死链巡检'
            });
            const body = `巡检时间：${new Date().toISOString()}\n\n以下站点两次请求均返回 404/410，确认失效：\n\n${list}\n\n处理方式：在 data/links.json 里把这些条目删掉，或改 status 为 dead。`;
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['死链巡检']
              });
            }
