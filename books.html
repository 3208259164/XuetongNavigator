<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>经典书库 | 资源导航</title>
<meta name="description" content="马列经典著作书库，马克思、恩格斯、列宁、毛泽东著作合集，支持在线阅读与下载。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6BFF'/%3E%3Cpath d='M9 20l4-9 4 6 3-4 3 7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<style>
.bhead{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  height:60px;padding:0 18px;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.bhead .bk{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--sub);font-size:16px;text-decoration:none;
}
.bhead .bk:hover{background:var(--panel-2)}
.bhead h1{font-size:15px;font-weight:600}
.bhead .cnt{margin-left:auto;font-size:12px;color:var(--faint)}
.bwrap{max-width:820px;margin:0 auto;padding:16px 18px 60px}
.bhero{font-size:12.5px;color:var(--sub);line-height:1.7;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:14px}
.bhero a{color:var(--brand)}
.bsrch{position:relative;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;height:40px;padding:0 16px;margin-bottom:14px}
.bsrch input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
.bgroups{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.bgroups::-webkit-scrollbar{display:none}
.bgroups button{
  flex:none;padding:7px 14px;border-radius:999px;font-size:13px;
  background:var(--panel);border:1px solid var(--line);color:var(--sub);
}
.bgroups button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
html[data-theme="dark"] .bgroups button.on{color:#0e1116}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;
}
.bitem:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));transform:translateY(-1px)}
.bitem:active{transform:scale(.99)}
.bnum{width:28px;flex:none;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.binfo{flex:1;min-width:0}
.bt{font-size:14px;font-weight:550;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:8px;align-items:center}
.bfmt{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--panel-2);color:var(--sub);text-transform:uppercase}
.barrow{color:var(--faint);font-size:14px;flex:none}
.bempty{padding:60px 0;text-align:center;color:var(--faint);font-size:13px}
</style>
</head>
<body>

<header class="bhead">
  <a class="bk" href="index.html" aria-label="返回">&#8592;</a>
  <h1>经典书库</h1>
  <span class="cnt" id="cnt"></span>
</header>

<div class="bwrap">
  <div class="bhero">
    收录 <strong id="total">0</strong> 部马列经典著作，书源来自
    <a href="https://marxism.forum/" target="_blank" rel="noopener">马列毛主义研习社</a>，
    点击条目跳转到原站阅读与下载。
  </div>

  <div class="bsrch">
    <span style="color:var(--faint);margin-right:8px">⌕</span>
    <input id="q" type="search" placeholder="搜书名或作者" autocomplete="off">
  </div>

  <nav class="bgroups" id="groups"></nav>
  <main class="blist" id="list"></main>
</div>

<script>
(function(){
  var D=null, state={group:'all', q:''};
  var $=function(s){return document.querySelector(s)};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

  function applyTheme(){
    var t=null;
    try{t=localStorage.getItem('nav_theme_v1')}catch(e){}
    if(!t) t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);
  }

  function list(){
    var q=state.q;
    return D.books.filter(function(b){
      // 有关键词时跨分组搜索，不受当前分组限制
      if(q){
        var hay=(b.title+' '+b.author+' '+b.tag).toLowerCase();
        return hay.indexOf(q)>=0;
      }
      if(state.group!=='all' && b.group!==state.group) return false;
      return true;
    });
  }

  function render(){
    var arr=list();
    $('#cnt').textContent=arr.length+' 部';
    if(!arr.length){$('#list').innerHTML='<div class="bempty">没有匹配的书目</div>';return}
    $('#list').innerHTML=arr.map(function(b,i){
      return '<a class="bitem" href="'+esc(b.url)+'" target="_blank" rel="noopener">'+
        '<span class="bnum">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="binfo"><span class="bt">'+esc(b.title)+'</span>'+
        '<span class="bm"><span>'+esc(b.author)+'</span><span>'+esc(b.tag)+'</span>'+
        '<span class="bfmt">'+esc(b.fmt)+'</span></span></span>'+
        '<span class="barrow">&#8599;</span></a>';
    }).join('');
  }

  function renderGroups(){
    var g=[{name:'全部',key:'all',count:D.count}].concat(D.groups.map(function(x){
      return {name:x.name,key:x.name,count:x.count}}));
    $('#groups').innerHTML=g.map(function(x){
      return '<button data-g="'+esc(x.key)+'"'+(state.group===x.key?' class="on"':'')+'>'+
        esc(x.name)+' '+x.count+'</button>';
    }).join('');
  }

  function bind(){
    document.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('#groups button'):null;
      if(b){state.group=b.getAttribute('data-g');renderGroups();render();}
    });
    var t=null;
    $('#q').addEventListener('input',function(e){
      clearTimeout(t);
      t=setTimeout(function(){state.q=e.target.value.trim().toLowerCase();render()},120);
    });
  }

  applyTheme();
  fetch('data/books.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
    D=d; $('#total').textContent=d.count;
    renderGroups(); render(); bind();
  }).catch(function(){
    $('#list').innerHTML='<div class="bempty">书目加载失败，请刷新重试</div>';
  });
})();
</script>
</body>
</html>
